[build]
  publish = "RecirculateLoe"
  command = "echo 'No build needed'"

[[redirects]]
  from = "/*"
  to = "/home/home.html"
  status = 200
  force = false
  
[[redirects]]
  from = "/"
  to = "/home/home.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
